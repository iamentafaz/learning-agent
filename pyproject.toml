[project]
name = "personal-learning-agent"
version = "0.1.0"
description = "A daily, adaptive learning email for English, Class 10 maths, and brain-stimulating reading."
requires-python = ">=3.12"
dependencies = [
  "openai>=2.0.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "SQLAlchemy>=2.0.0",
]

[project.scripts]
learning-agent = "learning_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
